<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Site</title>
</head>
<body>

    {% if is_logged_in %}
        <h1>Welcome Back!</h1>
    {% else %}
        <h1>Please Log in</h1>
    {% endif %}

    {% if marks >=90 %}
    <h1>Grade A</h1>
    {% elif marks >=70 %}
    <h1>Grade B</h1>
      {% elif marks >=50 %}
    <h1>Grade C</h1>
    {% else %}
    <h1>Fail</h1>
    {% endif %}
</body>
</html>
